- type: inventoryTemplate
  id: anytaur
  slots:
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 5
      uiWindowPos: 0,2
      strippingWindowPos: 0,2
      displayName: inventory-slot-jumpsuit # Ru-Localization
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      slotGroup: MainHotbar
      stripTime: 6
      uiWindowPos: 1,2
      strippingWindowPos: 1,2
      displayName: inventory-slot-outer-clothing # Ru-Localization
      blacklist:
        tags:
          - FullBodyOuter
    - name: gloves
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 2,2
      strippingWindowPos: 2,2
      displayName: inventory-slot-gloves # Ru-Localization
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 0,1
      strippingWindowPos: 0,1
      displayName: inventory-slot-neck # Ru-Localization
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,1
      strippingWindowPos: 1,1
      displayName: inventory-slot-mask # Ru-Localization
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 2
      uiWindowPos: 0,0
      strippingWindowPos: 0,0
      displayName: inventory-slot-eyes # Ru-Localization
    - name: ears
      slotTexture: ears
      slotFlags: EARS
      stripTime: 2
      uiWindowPos: 2,0
      strippingWindowPos: 2,1
      displayName: Ears
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,0
      strippingWindowPos: 1,0
      displayName: inventory-slot-head # Ru-Localization
    - name: pocket1
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 2
      uiWindowPos: 0,3
      strippingWindowPos: 0,3
      dependsOn: jumpsuit
      displayName: inventory-slot-pocket-1 # Ru-Localization
      stripHidden: true
    - name: pocket2
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 2
      uiWindowPos: 2,3
      strippingWindowPos: 2,3
      dependsOn: jumpsuit
      displayName: inventory-slot-pocket-2 # Ru-Localization
      stripHidden: true
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      stripTime: 2
      uiWindowPos: 2,0
      strippingWindowPos: 2,0
      dependsOn: outerClothing
      displayName: inventory-slot-suit-storage # Ru-Localization
    - name: id
      slotTexture: id
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      dependsOn: jumpsuit
      displayName: inventory-slot-id # Ru-Localization
    - name: belt
      slotTexture: belt
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 5
      uiWindowPos: 3,1
      strippingWindowPos: 1,3
      displayName: inventory-slot-belt # Ru-Localization
    - name: back
      slotTexture: back
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 5
      uiWindowPos: 3,0
      strippingWindowPos: 0,4
      displayName: inventory-slot-back # Ru-Localization